name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast job: builds the platform-agnostic core and runs the unit tests.
  # Keeps the Linux port honest long before the Linux backends exist.
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-core

      - name: Build
        run: cmake --build --preset linux-core --parallel

      - name: Test
        run: ctest --preset linux-core

  # Full build: core + FFmpeg media layer + Windows platform layer + CLI.
  windows:
    runs-on: windows-latest
    # Backstop only. A cold Qt+FFmpeg build runs ~2.5 h; the archive cache
    # below is what makes the steady state fast.
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Only release dependencies are ever linked (the preset builds
      # RelWithDebInfo), and it was the debug half of Qt that exhausted the
      # runner. Halves both the build time and the disk footprint.
      VCPKG_TRIPLET: x64-windows-release
      # Buildtrees, downloads and the binary cache all live on C:; the
      # workspace drive is small and Qt's buildtree does not fit on it.
      VCPKG_DOWNLOADS: C:\vcpkg-downloads
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          # Pinned to a commit verified to build this manifest (keep in sync
          # with release.yml). Bump deliberately, not implicitly.
          ref: f87344cac03158cbf1467264565f1fd36b382a24

      - name: Bootstrap vcpkg
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat
        shell: cmd

      # Dependency archives (FFmpeg and Qt take hours to build) are kept in
      # a plain directory cached by actions/cache. vcpkg's own `x-gha`
      # provider talks to the retired Actions Cache v1 endpoint on this
      # pinned vcpkg, so it never hit and every run rebuilt Qt from source.
      - name: Restore vcpkg dependency archives
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      # The windows-ci preset uses Ninja so the build works with whatever
      # Visual Studio the runner image ships (the VS2022 generator broke
      # when windows-latest moved to a newer VS). This puts cl.exe in the
      # environment for Ninja to find.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure Ninja is installed
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      # --clean-after-build deletes each port's buildtree once it is
      # installed; FFmpeg+Qt buildtrees otherwise exhaust the runner disk.
      # On failure the log tail is emitted as an ::error:: annotation so the
      # cause is visible from the public checks API, not just the run log.
      - name: Configure
        shell: pwsh
        run: |
          # The VS developer environment points VCPKG_ROOT at VS's bundled
          # vcpkg; force it back to our pinned checkout.
          $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $ninja = (Get-Command ninja).Source -replace '\\', '/'
          cmake --version
          where.exe cl
          cmake --preset windows-ci `
            -D "VCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" `
            -D "VCPKG_HOST_TRIPLET=$env:VCPKG_TRIPLET" `
            -D "VCPKG_INSTALL_OPTIONS=--clean-after-build;--x-buildtrees-root=C:/vcpkg-bt" `
            -D "CMAKE_MAKE_PROGRAM=$ninja" 2>&1 |
            Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content configure.log -Tail 40) -join '%0A'
            Write-Output "::error title=CMake configure failed::$tail"
            exit 1
          }

      # Saved even when the job fails or times out — vcpkg archives are
      # per-port, so a run that only got halfway still lets the next one
      # pick up where it left off. actions/cache's own post step is skipped
      # on cancellation, which is exactly when a cold build needs it.
      - name: Save vcpkg dependency archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-${{ github.run_id }}

      - name: Upload dependency build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-failure-logs
          path: C:\vcpkg-bt\**\*.log
          if-no-files-found: ignore

      - name: Build
        run: cmake --build --preset windows-ci --parallel

      - name: Test
        run: ctest --preset windows-ci

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: clipster-windows-x64
          path: |
            build/windows-ci/apps/gui/Clipster.exe
            build/windows-ci/apps/cli/clipster-cli.exe
          if-no-files-found: error
